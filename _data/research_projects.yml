- title: Bernstein-based estimation of the cross-ratio function
  summary: Developing flexible statistical methods to describe how the association between two outcomes
    changes across their distributions, with particular applications to event-time data.
  details:
  - >-
    The cross-ratio function describes local dependence that a single overall correlation measure
    can conceal. This line of research uses Bernstein polynomials to obtain smooth, nonparametric
    estimates without imposing a fixed parametric form on that dependence.
  - >-
    The methodological foundation is Abrams et al. (2020), published in Annals of the Institute of
    Statistical Mathematics. The paper constructs an estimator from the survival copula and its
    derivatives, establishes asymptotic normality, and evaluates performance through simulations
    and an application to household food expenditure and income. Abrams et al. (2024), in Statistics,
    develops an alternative Bernstein-based plug-in estimator using the joint survival function
    and its derivatives. It also establishes asymptotic normality and assesses the estimator using
    simulations and hospital data.
  - >-
    Sercik et al. (2026), in Dependence Modeling, extends this approach to data subject to univariate
    right censoring. Bernstein estimates of the survival
    copula, its partial derivatives and its density provide a smooth estimate of local association.
    Simulation experiments and a real-data application assess its finite-sample performance.
  role: Co-investigator
  period: 2022–2025
  funding: FWO Junior Fundamental Research Project · G011022N
  links_heading: Related publications
  links:
  - label: 'Abrams et al. (2020) — Nonparametric estimation of the cross ratio function. Annals of the Institute of Statistical Mathematics, 72, 771–801.'
    url: /publication/2020-01-01-nonparametric-estimation-of-the-cross-ratio-function/
  - label: 'Abrams et al. (2024) — Bernstein-based estimation of the cross ratio function. Statistics, 58(1), 230–246.'
