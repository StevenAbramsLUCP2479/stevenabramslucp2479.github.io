- title: Measles, mumps and rubella surveillance
  summary: Surveillance, outbreak assessment and outbreak management in collaboration with the Belgian
    Scientific Institute of Public Health (WIV-ISP).
  details:
  - >-
    This research combines serological surveys, vaccination coverage and modelling to identify
    immunity gaps and assess outbreak potential in highly vaccinated populations. The aim is to
    understand which age groups and geographical areas remain susceptible and how this susceptibility
    may change over time.
  - >-
    Abrams, Beutels and Hens (2014), in the American Journal of Epidemiology, is the original
    methodological paper in this line of outbreak-risk research. Using Belgian mumps data, it
    develops a method to identify areas with high outbreak potential and project effective
    reproduction numbers, incorporating primary vaccine failure and waning immunity. Hens et al.
    (2015), in Eurosurveillance, applies the multicohort approach to measles, combining spatial
    serology, vaccination coverage and social-contact data. The analysis identifies the potential
    for resurgence, particularly during school terms, and highlights susceptibility among
    adolescents and young adults and the vulnerability of infants.
  - >-
    Schenk et al. (2022), in Vaccine, adds a Bayesian cohort analysis of Belgian serological surveys
    from 2002, 2006 and 2013. It identifies persistent measles immunity gaps in birth cohorts offered
    vaccination at suboptimal coverage during the early years of routine vaccination. Together,
    these studies connect the original outbreak-risk methodology with later evidence on population
    immunity, providing a basis for assessing targeted vaccination strategies.
  links_heading: Related publications
  links:
