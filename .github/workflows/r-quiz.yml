name: R quiz checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: quiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: quiz-service
    env:
      QUIZ_DEBUG: '1'
      DATABASE_URL: postgres://quiz:test-only-password@localhost:5432/quiz
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quiz-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test assessment --verbosity 2
      - name: Production security settings
        run: python manage.py check --deploy --fail-level WARNING
        env:
          QUIZ_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-long-random-looking-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DJANGO_ALLOWED_HOSTS: quiz.example.edu
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assessment/static/assessment/quiz.js
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          python manage.py migrate --noinput
          python scripts/seed-browser-test.py
          python manage.py runserver 127.0.0.1:8000 --noreload > quiz-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/login/ && break; sleep 1; done
          node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiz-browser-screenshots
          path: |
            quiz-service/quiz-*.png
            quiz-service/quiz-server.log
  r-answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - run: Rscript scripts/check-bank.R
        working-directory: quiz-service
